<svg viewBox="0 0 910 810" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="">
<title id="title" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">후보물질 가설 생성 단계 아키텍처</title>
<desc id="desc" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">문헌, 오믹스, 화합물 DB를 입력받는 세 개의 에이전트가 공유 지식 통합 계층을 거쳐 가설 생성 추론 엔진으로 모이고, 최종적으로 후보물질 가설 목록을 출력하는 흐름을 보여주는 다이어그램. 이후 단계인 in-silico 필터링은 점선으로 범위 밖임을 표시.</desc>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#5b7fa6"/>
</marker>
<marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#8a8a8a"/>
</marker>
</defs>

